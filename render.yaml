# Render blueprint. Deploys site/ as a static site with no build step.
# In Render: New > Blueprint > connect this repo, or configure manually with
# Publish Directory = site and an empty Build Command.
services:
  - type: web
    name: finlm
    runtime: static
    staticPublishPath: ./site
    buildCommand: ""
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfin"
version = "0.2.0"
description = "MCP-based trading intelligence layer for Indian markets (NSE) - scanner, signals, research, journal, and risk-gated execution via Zerodha Kite Connect"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "kiteconnect>=5.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Only tests/ is a test suite. artifacts/ holds one-off analysis scripts, and
# pytest's default glob picks up names like decay_test.py and executes them at
# import - which fails, and would be a confusing way to break the suite.
testpaths = ["tests"]

[project.scripts]
llmfin-server = "llmfin.server:main"
llmfin-research = "llmfin.batch_runner:main"
llmfin-scan = "llmfin.scanner:main"
llmfin-scan-accum = "llmfin.accumulation_scanner:main"
llmfin-anomalies = "llmfin.diagnostics:main"          # data-quality anomalies (corporate actions)
llmfin-replicate = "llmfin.anomalies:main"            # cross-sectional anomaly replication study
llmfin-portfolio-backtest = "llmfin.portfolio_backtest:main"
llmfin-regime-analysis = "llmfin.regime_analysis:main"
llmfin-ingest = "llmfin.data_store:main"
llmfin-backtest = "llmfin.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]
